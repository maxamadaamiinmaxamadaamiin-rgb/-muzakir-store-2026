<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم متجر مذاكر</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6f4;color:#173b2c;margin:0;padding:20px}
main{max-width:650px;margin:auto}
section{background:white;padding:18px;border-radius:12px;margin-bottom:16px}
h1{color:#087653}
input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:8px}
input{border:1px solid #ccc}
button{background:#087653;color:white;border:0;font-size:16px}
.item{border:1px solid #ddd;padding:12px;margin-top:10px;border-radius:8px}
small{color:#666}
</style>
</head>
<body>
<main>
<section>
<h1>لوحة تحكم مُذاكر</h1>
<p>إضافة المواد وتعديل الأسعار</p>
<label>اسم المادة</label>
<input id="name" placeholder="مثال: النظم الإسلامية 2">
<label>السعر بالدولار</label>
<input id="price" type="number" min="0" step="0.5" placeholder="3">
<button onclick="addProduct()">إضافة المادة</button>
<small>هذه نسخة تجريبية؛ البيانات محفوظة على هذا المتصفح فقط.</small>
</section>
<section>
<h2>المواد الموجودة</h2>
<div id="products"></div>
</section>
</main>
<script>
let products=JSON.parse(localStorage.getItem('muzakirProducts')||'[]');
if(!products.length){
 products=[
  {name:'النظم الإسلامية',price:2},
  {name:'النظم الإسلامية 2',price:3}
 ];
}
function save(){
 localStorage.setItem('muzakirProducts',JSON.stringify(products));
 render();
}
function addProduct(){
 const name=document.getElementById('name').value.trim();
 const price=Number(document.getElementById('price').value);
 if(!name||document.getElementById('price').value===''||price<0){
  alert('أدخل اسم المادة وسعرًا صحيحًا');return;
 }
 products.push({name,price});
 save();
 document.getElementById('name').value='';
 document.getElementById('price').value='';
}
function render(){
 document.getElementById('products').innerHTML=products.map((p,i)=>
  '<div class="item"><b>'+escapeText(p.name)+'</b><p>'+p.price+' دولار</p>'+
  '<button onclick="editProduct('+i+')">تعديل السعر</button>'+
  '<button onclick="deleteProduct('+i+')">حذف المادة</button></div>'
 ).join('');
}
function escapeText(s){
 const d=document.createElement('div');d.textContent=s;return d.innerHTML;
}
function editProduct(i){
 const value=prompt('أدخل السعر الجديد بالدولار',products[i].price);
 if(value===null||value.trim()===''||!Number.isFinite(Number(value))||Number(value)<0){
  if(value!==null)alert('أدخل سعرًا صحيحًا');return;
 }
 products[i].price=Number(value);save();
}
function deleteProduct(i){
 if(confirm('هل تريد حذف هذه المادة؟')){products.splice(i,1);save();}
}
render();
</script>
</body>
  </html>
