
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <style>

        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto 20px; }
        .price { font-size: 1.5rem; color: #27ae60; font-weight: bold; margin: 10px 0; }
        .btn { background: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 1rem; width: 100%; }
        .box { display: none; background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; border: 2px dashed #27ae60; }

    </style>
</head>

        <h1>أهلاً وسهلاً بك في متجرنا 👋</h1>

    <div class="card">

        <div class="price">10 $</div>
        <button class="btn" onclick="showPayment()">شراء الآن</button>
    </div>

    <div id="paymentBox" class="card" style="display:none;">
        <h3>إتمام عملية الدفع</h3>
        <form onsubmit="finishPayment(event)">
            <input type="text" placeholder="الاسم الكامل" required>
            <select required>
                <option value="">اختر طريقة الدفع</option>
                <option value="card">بطاقة مصرفية / الفيزا</option>
                <option value="wallet">محفظة إلكترونية</option>
            </select>
            <input type="text" placeholder="رقم الإيصال / المعاملة" required>
            <button class="btn" style="background:#27ae60;">تأكيد الدفع</button>
        </form>
    </div>
